<!-- dashboard.html -->
<div class="max-w-7xl mx-auto space-y-6 w-full pb-4">
    
    <!-- BLOCO 1: KPIs (Indicadores Chave) -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5 border-l-4 border-l-emerald-500 hover:shadow-md transition-shadow">
            <div class="flex justify-between items-start mb-2">
                <p class="text-[10px] md:text-xs text-slate-500 font-bold uppercase tracking-wider">Faturamento</p>
                <i class="ph-fill ph-trend-up text-emerald-500 text-lg"></i>
            </div>
            <p class="text-xl md:text-2xl font-black text-slate-800 truncate" id="dash-fat">R$ 0,00</p>
        </div>
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5 border-l-4 border-l-amber-500 hover:shadow-md transition-shadow">
            <div class="flex justify-between items-start mb-2">
                <p class="text-[10px] md:text-xs text-slate-500 font-bold uppercase tracking-wider">A Receber</p>
                <i class="ph-fill ph-clock text-amber-500 text-lg"></i>
            </div>
            <p class="text-xl md:text-2xl font-black text-slate-800 truncate" id="dash-rec">R$ 0,00</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5 border-l-4 border-l-blue-500 hover:shadow-md transition-shadow">
            <div class="flex justify-between items-start mb-2">
                <p class="text-[10px] md:text-xs text-slate-500 font-bold uppercase tracking-wider">Orçamentos</p>
                <i class="ph-fill ph-receipt text-blue-500 text-lg"></i>
            </div>
            <p class="text-xl md:text-2xl font-black text-slate-800" id="dash-orc">0</p>
        </div>

        <div class="bg-red-50 rounded-xl shadow-sm border border-red-100 p-5 border-l-4 border-l-red-500 hover:shadow-md transition-shadow">
            <div class="flex justify-between items-start mb-2">
                <p class="text-[10px] md:text-xs text-red-600 font-bold uppercase tracking-wider">Inadimplência</p>
                <i class="ph-fill ph-warning-circle text-red-500 text-lg"></i>
            </div>
            <p class="text-xl md:text-2xl font-black text-red-600 truncate" id="dash-inad">0 Notas</p>
        </div>
    </div>

    <!-- BLOCO 2: Gráficos de Análise Avançada -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 lg:col-span-2">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Fluxo de Caixa (6 Meses)</h3>
                <span class="bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-1 rounded">2026</span>
            </div>
            <div class="relative w-full h-48 md:h-64">
                <canvas id="chartFaturamento"></canvas>
            </div>
        </div>
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 flex flex-col">
            <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-6">Status da Frota</h3>
            <div class="flex-1 relative w-full h-48 md:h-auto flex items-center justify-center">
                <canvas id="chartFrota"></canvas>
            </div>
        </div>
    </div>

    <!-- BLOCO 3: Listagem Rápida -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
        <div class="p-5 border-b border-slate-100 flex justify-between items-center">
            <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Orçamentos Recentes</h3>
            <button onclick="navegarPara('orcamentos')" class="text-xs font-bold text-blue-600 hover:text-blue-800 transition">Ver Todos</button>
        </div>
        <div class="w-full overflow-x-auto">
            <table class="w-full text-left whitespace-nowrap">
                <thead class="bg-slate-50/80">
                    <tr class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">
                        <th class="px-5 py-4">Cliente / Vínculo</th>
                        <th class="px-5 py-4">Placa</th>
                        <th class="px-5 py-4 text-right">Valor Total</th>
                        <th class="px-5 py-4 text-center">Status</th>
                    </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100" id="lista-recentes">
                    <!-- Os dados entram aqui via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

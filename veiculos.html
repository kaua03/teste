<div class="max-w-7xl mx-auto w-full pb-28 md:pb-4 flex flex-col relative fade-in font-sans">
    
    <!-- ========================================== -->
    <!-- SUB-TELA 1: LISTAGEM DE VEÍCULOS           -->
    <!-- ========================================== -->
    <div id="view-lista-veiculos" class="space-y-6 block">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <h2 class="text-2xl font-black text-slate-800 tracking-tight">Frota e Veículos</h2>
                <p class="text-xs text-slate-500 mt-1 uppercase font-bold tracking-wider">Gestão de Automóveis</p>
            </div>
            <button onclick="alternarSubTelaVeiculos('novo')" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold shadow-[0_4px_12px_rgba(37,99,235,0.3)] transition-transform transform active:scale-95 flex items-center justify-center gap-2">
                <i class="ph-bold ph-jeep text-lg"></i> Novo Veículo
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex-1">
            <div class="w-full overflow-x-auto">
                <table class="w-full text-left whitespace-nowrap">
                    <thead class="bg-slate-50/80 border-b border-slate-100">
                        <tr class="text-slate-500 text-[10px] md:text-xs uppercase tracking-wider font-bold">
                            <th class="p-4 md:p-5">Cadastro</th>
                            <th class="p-4 md:p-5">Veículo / Placa</th>
                            <th class="p-4 md:p-5">Cor / Ano</th>
                            <th class="p-4 md:p-5">Proprietário</th>
                            <th class="p-4 md:p-5 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-veiculos-real" class="text-xs md:text-sm divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-8 text-center text-slate-400 font-medium"><i class="ph-bold ph-spinner animate-spin text-2xl mb-2 text-blue-600"></i><br>Buscando veículos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SUB-TELA 2: FORMULÁRIO DE VEÍCULO          -->
    <!-- ========================================== -->
    <div id="view-form-veiculo" class="space-y-6 hidden">
        <div class="flex items-center gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
            <button onclick="alternarSubTelaVeiculos('lista')" class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl hover:bg-slate-100 transition-colors text-slate-600">
                <i class="ph-bold ph-arrow-left text-lg"></i>
            </button>
            <div>
                <h2 id="titulo-tela-veiculo" class="text-xl md:text-2xl font-black text-slate-800 tracking-tight">Novo Veículo</h2>
                <p class="text-[10px] md:text-xs text-blue-600 font-bold uppercase mt-0.5 tracking-wider">Ficha do Automóvel</p>
            </div>
        </div>

        <div class="bg-white p-5 md:p-8 rounded-2xl shadow-sm border border-slate-100 max-w-4xl">
            <div class="space-y-5">
                <div class="border-b border-slate-100 pb-5">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Dono / Proprietário do Veículo</label>
                    <select id="vei-dono" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-blue-500 font-bold text-slate-800 cursor-pointer transition">
                        <option value="">Carregando Clientes...</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Placa (Padrão ou Mercosul) <span class="text-red-500">*</span></label>
                        <input type="text" id="vei-placa" onkeyup="mascaraGeralVeiculo('placa', this)" maxlength="8" placeholder="ABC-1234" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-blue-500 font-black uppercase text-blue-700">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nome / Modelo <span class="text-red-500">*</span></label>
                        <input type="text" id="vei-modelo" placeholder="Ex: Fiat Strada" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-blue-500 font-medium">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Cor</label>
                        <input type="text" id="vei-cor" placeholder="Ex: Branco" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-blue-500 font-medium">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Ano</label>
                        <input type="number" id="vei-ano" placeholder="2024" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-blue-500 font-medium">
                    </div>
                </div>
            </div>

            <div class="mt-8 flex justify-end gap-3 pt-5 border-t border-slate-100">
                <button onclick="alternarSubTelaVeiculos('lista')" class="px-6 py-3 text-slate-500 font-bold hover:bg-slate-100 rounded-xl transition text-sm">Cancelar</button>
                <button onclick="salvarVeiculoBD()" id="btn-salvar-vei" class="px-8 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-[0_4px_12px_rgba(37,99,235,0.3)] hover:bg-blue-700 transition transform active:scale-95 text-sm flex items-center gap-2">
                    <i class="ph-bold ph-floppy-disk text-lg"></i> Salvar Veículo
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Genérico para Confirmações (Otimizado, Sem Blur e Reutilizável) -->
<div id="modal-confirmacao-generica" class="hidden fixed inset-0 bg-slate-900/80 z-[2000] flex items-center justify-center p-4 fade-in">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden transform transition-all">
        <div class="p-6 text-center">
            <div id="icone-confirmacao" class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-100">
                <i class="ph-bold ph-warning text-3xl text-red-500"></i>
            </div>
            <h3 id="titulo-confirmacao" class="text-xl font-black text-slate-800 mb-2">Atenção!</h3>
            <p id="texto-confirmacao" class="text-sm text-slate-500 font-medium">Tem certeza que deseja continuar?</p>
        </div>
        <div class="p-4 bg-slate-50 border-t border-slate-100 flex gap-3">
            <button onclick="fecharModalConfirmacao()" class="flex-1 py-3 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-100 transition-colors shadow-sm">Cancelar</button>
            <button id="btn-confirmar-acao" onclick="executarAcaoConfirmada()" class="flex-1 py-3 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 transition-colors shadow-md flex items-center justify-center gap-2"><i class="ph-bold ph-check"></i> Confirmar</button>
        </div>
    </div>
</div>

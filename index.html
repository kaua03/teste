<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AutoManager - Master</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .sidebar-text { display: none; white-space: nowrap; opacity: 0; transition: opacity 0.3s; }
        .group:hover .sidebar-text { display: inline-block; opacity: 1; }
        .pb-safe { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom)); }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="h-screen flex overflow-hidden text-slate-800 relative">

    <div id="global-loader" class="fixed inset-0 bg-slate-50 z-[9999] flex flex-col items-center justify-center transition-opacity duration-300 hidden">
        <div class="relative w-20 h-20 mb-4">
            <div class="absolute inset-0 border-4 border-slate-200 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-blue-600 rounded-full border-t-transparent animate-spin"></div>
            <i class="ph-fill ph-car-profile absolute inset-0 flex items-center justify-center text-3xl text-blue-600"></i>
        </div>
        <h2 class="text-lg font-black text-slate-800 tracking-tight">Sincronizando...</h2>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1" id="loader-texto">Acessando banco de dados</p>
    </div>

    <aside id="sidebar-desktop" class="group fixed top-0 left-0 h-full w-20 hover:w-64 bg-slate-900 text-white transition-all duration-300 z-50 hidden md:flex flex-col shadow-2xl overflow-hidden">
        <div class="h-16 flex items-center px-5 border-b border-slate-800 w-64">
            <i class="ph-fill ph-car-profile text-3xl text-blue-500 shrink-0"></i>
            <h1 class="text-xl font-black ml-4 tracking-tight sidebar-text text-white">Auto<span class="text-blue-500">Manager</span></h1>
        </div>
        <nav class="flex-1 mt-6 flex flex-col gap-2 px-3 w-64">
            <button onclick="navegarPara('dashboard')" data-target="dashboard" class="nav-btn flex items-center gap-4 p-3 rounded-xl transition-colors w-full bg-blue-600 text-white shadow-md"><i class="ph-fill ph-squares-four text-2xl shrink-0"></i><span class="font-bold sidebar-text">Dashboard</span></button>
            <button onclick="navegarPara('orcamentos')" data-target="orcamentos" class="nav-btn flex items-center gap-4 p-3 rounded-xl transition-colors w-full text-slate-400 hover:bg-slate-800"><i class="ph-fill ph-receipt text-2xl shrink-0"></i><span class="font-bold sidebar-text">Orçamentos</span></button>
            <button onclick="navegarPara('clientes')" data-target="clientes" class="nav-btn flex items-center gap-4 p-3 rounded-xl transition-colors w-full text-slate-400 hover:bg-slate-800"><i class="ph-fill ph-users text-2xl shrink-0"></i><span class="font-bold sidebar-text">Clientes</span></button>
            <button onclick="navegarPara('veiculos')" data-target="veiculos" class="nav-btn flex items-center gap-4 p-3 rounded-xl transition-colors w-full text-slate-400 hover:bg-slate-800"><i class="ph-fill ph-car text-2xl shrink-0"></i><span class="font-bold sidebar-text">Veículos</span></button>
            <button onclick="navegarPara('contas_pagar')" data-target="contas_pagar" class="nav-btn flex items-center gap-4 p-3 rounded-xl transition-colors w-full text-slate-400 hover:bg-slate-800"><i class="ph-fill ph-money text-2xl shrink-0"></i><span class="font-bold sidebar-text">Contas a Pagar</span></button>
            <button onclick="navegarPara('contas_receber')" data-target="contas_receber" class="nav-btn flex items-center gap-4 p-3 rounded-xl transition-colors w-full text-slate-400 hover:bg-slate-800"><i class="ph-fill ph-hand-coins text-2xl shrink-0"></i><span class="font-bold sidebar-text">Contas a Receber</span></button>
        </nav>
    </aside>

    <div id="main-wrapper" class="flex-1 flex flex-col h-full w-full md:ml-20 relative transition-all">
        
        <header id="header-top" class="bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 md:px-8 py-3 md:py-4 flex justify-between items-center z-10 sticky top-0 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="md:hidden bg-blue-600 p-2 rounded-lg text-white shadow-sm"><i class="ph-bold ph-car-profile text-xl"></i></div>
                <h2 class="text-lg md:text-xl font-black text-slate-800 tracking-tight">AutoManager</h2>
            </div>
            <div class="flex items-center gap-4">
                
                <div class="relative">
                    <div onclick="toggleUserMenu()" id="user-avatar" class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold shadow-md cursor-pointer hover:bg-blue-700 transition select-none" title="Opções">U</div>
                    
                    <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 overflow-hidden z-50 fade-in">
                        <div class="p-3 border-b border-slate-100 bg-slate-50">
                            <p id="dropdown-user-name" class="text-xs font-black text-slate-800">Usuário</p>
                            <p id="dropdown-user-email" class="text-[10px] font-bold text-slate-400 truncate mt-0.5">email@oficina.com</p>
                        </div>
                        <button onclick="fazerLogout()" class="w-full text-left px-4 py-3 text-sm text-red-600 font-bold hover:bg-red-50 flex items-center gap-2 transition-colors">
                            <i class="ph-bold ph-sign-out text-lg"></i> Sair do Sistema
                        </button>
                    </div>
                </div>

            </div>
        </header>

        <main id="visor-da-tv" class="flex-1 overflow-y-auto overflow-x-hidden p-4 md:p-8 pb-safe fade-in bg-slate-50/50"></main>
    </div>

    <nav id="nav-mobile" class="md:hidden fixed bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-200 flex justify-around items-center h-[4.5rem] z-50 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] pb-2 overflow-x-auto">
        <button onclick="navegarPara('dashboard')" data-target="dashboard" class="nav-item-mob flex flex-col items-center justify-center min-w-[3.5rem] gap-1 text-blue-600 active transition-colors"><i class="ph-fill ph-squares-four text-xl"></i><span class="text-[9px] font-bold">Início</span></button>
        <button onclick="navegarPara('orcamentos')" data-target="orcamentos" class="nav-item-mob flex flex-col items-center justify-center min-w-[3.5rem] gap-1 text-slate-400 transition-colors hover:text-slate-600"><i class="ph-fill ph-receipt text-xl"></i><span class="text-[9px] font-bold">O.S.</span></button>
        <button onclick="navegarPara('clientes')" data-target="clientes" class="nav-item-mob flex flex-col items-center justify-center min-w-[3.5rem] gap-1 text-slate-400 transition-colors hover:text-slate-600"><i class="ph-fill ph-users text-xl"></i><span class="text-[9px] font-bold">Clientes</span></button>
        <button onclick="navegarPara('veiculos')" data-target="veiculos" class="nav-item-mob flex flex-col items-center justify-center min-w-[3.5rem] gap-1 text-slate-400 transition-colors hover:text-slate-600"><i class="ph-fill ph-car text-xl"></i><span class="text-[9px] font-bold">Veículos</span></button>
        <button onclick="navegarPara('contas_pagar')" data-target="contas_pagar" class="nav-item-mob flex flex-col items-center justify-center min-w-[3.5rem] gap-1 text-slate-400 transition-colors hover:text-slate-600"><i class="ph-fill ph-money text-xl"></i><span class="text-[9px] font-bold">Pagar</span></button>
        <button onclick="navegarPara('contas_receber')" data-target="contas_receber" class="nav-item-mob flex flex-col items-center justify-center min-w-[3.5rem] gap-1 text-slate-400 transition-colors hover:text-slate-600"><i class="ph-fill ph-hand-coins text-xl"></i><span class="text-[9px] font-bold">Receber</span></button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="router.js"></script>
    
    <script src="login.js"></script>
    <script src="dashboard.js"></script>
    <script src="orcamentos.js"></script>
    <script src="clientes.js"></script>
    <script src="veiculos.js"></script>
    <script src="contas_pagar.js"></script>
    <script src="contas_receber.js"></script>

    <script>
        // Função para abrir/fechar o Menu do Avatar
        function toggleUserMenu() {
            const drop = document.getElementById('user-dropdown');
            drop.classList.toggle('hidden');
        }

        // Fechar o menu ao clicar fora
        document.addEventListener('click', (e) => {
            const avatar = document.getElementById('user-avatar');
            const drop = document.getElementById('user-dropdown');
            if(avatar && drop && !avatar.contains(e.target) && !drop.contains(e.target)) {
                drop.classList.add('hidden');
            }
        });

        window.onload = () => { 
            // A MÁGICA DA MEMÓRIA: Puxa a última tela salva ou vai pro dashboard
            const ultimaTela = localStorage.getItem('lastRoute') || 'dashboard';
            navegarPara(ultimaTela); 
        };
    </script>
</body>
</html>

<!-- contas_receber.html -->
<div class="max-w-7xl mx-auto w-full pb-28 md:pb-4 flex flex-col relative fade-in font-sans">
    
    <!-- SUB-TELA 1: LISTAGEM E ABAS -->
    <div id="view-lista-receber" class="space-y-6 block">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <h2 class="text-2xl font-black text-slate-800 tracking-tight">Contas a Receber</h2>
                <p class="text-xs text-slate-500 mt-1 uppercase font-bold tracking-wider">Entrada de Capital</p>
            </div>
            <button onclick="alternarSubTelaReceber('novo')" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold shadow-[0_4px_12px_rgba(16,185,129,0.3)] transition-transform transform active:scale-95 flex items-center justify-center gap-2">
                <i class="ph-bold ph-plus-circle text-lg"></i> Nova Receita
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex-1 flex flex-col">
            <!-- ABAS DE NAVEGAÇÃO -->
            <div class="flex border-b border-slate-100 bg-slate-50/50 p-2 gap-2">
                <button onclick="mudarAbaReceber('Pendente')" id="aba-pendentes-rec" class="flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-slate-800 shadow-sm border border-slate-200 transition-all">A Receber / Atrasadas</button>
                <button onclick="mudarAbaReceber('Pago')" id="aba-recebidas" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-500 hover:text-slate-700 transition-all">Histórico (Recebidas)</button>
            </div>

            <div class="w-full overflow-x-auto">
                <table class="w-full text-left whitespace-nowrap">
                    <thead class="bg-slate-50/80 border-b border-slate-100">
                        <tr class="text-slate-500 text-[10px] md:text-xs uppercase tracking-wider font-bold">
                            <th class="p-4 md:p-5">Vencimento</th>
                            <th class="p-4 md:p-5">Descrição / Categoria</th>
                            <th class="p-4 md:p-5 text-right">Valor</th>
                            <th class="p-4 md:p-5 text-center">Status</th>
                            <th class="p-4 md:p-5 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-receber-real" class="text-xs md:text-sm divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-8 text-center text-slate-400 font-medium"><i class="ph-bold ph-spinner animate-spin text-2xl mb-2 text-emerald-600"></i><br>Buscando receitas...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SUB-TELA 2: FORMULÁRIO DE RECEITA -->
    <div id="view-form-receber" class="space-y-6 hidden">
        <div class="flex items-center gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
            <button onclick="alternarSubTelaReceber('lista')" class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl hover:bg-slate-100 transition-colors text-slate-600">
                <i class="ph-bold ph-arrow-left text-lg"></i>
            </button>
            <div>
                <h2 id="titulo-tela-receber" class="text-xl md:text-2xl font-black text-slate-800 tracking-tight">Nova Receita</h2>
                <p class="text-[10px] md:text-xs text-emerald-600 font-bold uppercase mt-0.5 tracking-wider">Cadastro de Entrada</p>
            </div>
        </div>

        <div class="bg-white p-5 md:p-8 rounded-2xl shadow-sm border border-slate-100 max-w-3xl">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="md:col-span-2">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Descrição do Recebimento <span class="text-red-500 text-sm">*</span></label>
                    <input type="text" id="rec-desc" placeholder="Ex: O.S #0023, Manutenção Câmbio Cliente X..." class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-emerald-500 font-bold text-slate-800">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Categoria</label>
                    <select id="rec-cat" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-emerald-500 font-medium cursor-pointer">
                        <option value="Serviços O.S" selected>Serviços O.S</option>
                        <option value="Venda de Peças">Venda de Peças (Avulsa)</option>
                        <option value="Adiantamento">Adiantamento / Sinal</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Valor (R$) <span class="text-red-500 text-sm">*</span></label>
                    <input type="text" id="rec-val" onkeyup="mascaraMoeda(this)" placeholder="0,00" class="w-full border border-slate-300 p-3 rounded-xl text-lg bg-slate-50 focus:bg-white outline-none focus:border-emerald-500 font-black text-emerald-600">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Data de Vencimento / Previsão <span class="text-red-500 text-sm">*</span></label>
                    <input type="date" id="rec-venc" class="w-full md:w-1/2 border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-emerald-500 font-bold text-slate-700">
                </div>
            </div>

            <div class="mt-8 flex justify-end gap-3 pt-5 border-t border-slate-100">
                <button onclick="alternarSubTelaReceber('lista')" class="px-6 py-3 text-slate-500 font-bold hover:bg-slate-100 rounded-xl transition text-sm">Cancelar</button>
                <button onclick="salvarContaReceberBD()" id="btn-salvar-receber" class="px-8 py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-[0_4px_12px_rgba(16,185,129,0.3)] hover:bg-emerald-700 transition transform active:scale-95 text-sm flex items-center gap-2">
                    <i class="ph-bold ph-floppy-disk text-lg"></i> Salvar Receita
                </button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DE BAIXA (RECEBIMENTO) -->
<div id="modal-baixa-receber" class="hidden fixed inset-0 bg-slate-900/90 z-[1000] flex items-center justify-center p-4 backdrop-blur-sm fade-in">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden transform transition-all">
        <div class="bg-emerald-600 p-4 flex justify-between items-center text-white">
            <h3 class="font-bold text-lg"><i class="ph-bold ph-hand-coins mr-2"></i> Informar Recebimento</h3>
            <button onclick="fecharModalBaixaReceber()" class="hover:bg-emerald-700 p-1 rounded-lg transition"><i class="ph-bold ph-x text-xl"></i></button>
        </div>
        <div class="p-6 space-y-4">
            <div>
                <p class="text-xs text-slate-500 font-bold uppercase mb-1">A Receber:</p>
                <p id="baixa-receber-desc" class="font-bold text-slate-800 text-sm"></p>
                <p id="baixa-receber-val" class="font-black text-emerald-600 text-xl mt-1"></p>
            </div>
            <div class="border-t border-slate-100 pt-4">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Data do Recebimento</label>
                <input type="date" id="baixa-receber-data" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:border-emerald-500 outline-none font-bold">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Forma de Pagamento (Cliente)</label>
                <select id="baixa-receber-forma" class="w-full border border-slate-300 p-2.5 rounded-xl text-sm focus:border-emerald-500 outline-none font-medium">
                    <option value="Pix">Pix</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Dinheiro">Dinheiro Físico</option>
                    <option value="Transferência">Transferência Bancária</option>
                </select>
            </div>
        </div>
        <div class="p-4 bg-slate-50 border-t border-slate-100 flex gap-3">
            <button onclick="fecharModalBaixaReceber()" class="flex-1 py-2.5 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-100 transition-colors shadow-sm text-sm">Cancelar</button>
            <button onclick="confirmarBaixaReceber()" class="flex-1 py-2.5 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition-colors shadow-md text-sm">Confirmar Entrada</button>
        </div>
    </div>
</div>

<!-- MODAL DE EXCLUSÃO DE RECEITA -->
<div id="modal-exclusao-receber" class="hidden fixed inset-0 bg-slate-900/90 z-[1000] flex items-center justify-center p-4 backdrop-blur-sm fade-in">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden transform transition-all">
        <div class="p-6 text-center">
            <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-100">
                <i class="ph-bold ph-trash text-3xl text-red-500"></i>
            </div>
            <h3 class="text-xl font-black text-slate-800 mb-2">Excluir Receita?</h3>
            <p class="text-sm text-slate-500 font-medium">Esta ação apagará permanentemente este registro financeiro. <br>Não pode ser desfeita.</p>
        </div>
        <div class="p-4 bg-slate-50 border-t border-slate-100 flex gap-3">
            <button onclick="fecharModalExclusaoReceber()" class="flex-1 py-3 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-100 transition-colors shadow-sm">Cancelar</button>
            <button onclick="confirmarExclusaoReceber()" class="flex-1 py-3 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 transition-colors shadow-md flex items-center justify-center gap-2"><i class="ph-bold ph-warning"></i> Excluir</button>
        </div>
    </div>
</div>

<div class="max-w-7xl mx-auto w-full pb-28 md:pb-4 flex flex-col relative fade-in font-sans">
    
    <!-- ========================================== -->
    <!-- SUB-TELA 1: LISTAGEM DE CLIENTES           -->
    <!-- ========================================== -->
    <div id="view-lista-clientes" class="space-y-6 block">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <h2 class="text-2xl font-black text-slate-800 tracking-tight">Carteira de Clientes</h2>
                <p class="text-xs text-slate-500 mt-1 uppercase font-bold tracking-wider">Gestão e Contatos</p>
            </div>
            <button onclick="alternarSubTelaClientes('novo')" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold shadow-[0_4px_12px_rgba(37,99,235,0.3)] transition-transform transform active:scale-95 flex items-center justify-center gap-2">
                <i class="ph-bold ph-user-plus text-lg"></i> Novo Cliente
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex-1">
            <div class="w-full overflow-x-auto">
                <table class="w-full text-left whitespace-nowrap">
                    <thead class="bg-slate-50/80 border-b border-slate-100">
                        <tr class="text-slate-500 text-[10px] md:text-xs uppercase tracking-wider font-bold">
                            <th class="p-4 md:p-5">ID / Cadastro</th>
                            <th class="p-4 md:p-5">Nome do Cliente</th>
                            <th class="p-4 md:p-5">Contato</th>
                            <th class="p-4 md:p-5">Localidade</th>
                            <th class="p-4 md:p-5 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-clientes-real" class="text-xs md:text-sm divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-8 text-center text-slate-400 font-medium"><i class="ph-bold ph-spinner animate-spin text-2xl mb-2 text-blue-600"></i><br>Buscando clientes...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SUB-TELA 2: FORMULÁRIO DE CLIENTE          -->
    <!-- ========================================== -->
    <div id="view-form-cliente" class="space-y-6 hidden">
        <div class="flex items-center gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
            <button onclick="alternarSubTelaClientes('lista')" class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl hover:bg-slate-100 transition-colors text-slate-600">
                <i class="ph-bold ph-arrow-left text-lg"></i>
            </button>
            <div>
                <h2 id="titulo-tela-cliente" class="text-xl md:text-2xl font-black text-slate-800 tracking-tight">Novo Cliente</h2>
                <p class="text-[10px] md:text-xs text-blue-600 font-bold uppercase mt-0.5 tracking-wider">Ficha Cadastral</p>
            </div>
        </div>

        <div class="bg-white p-5 md:p-8 rounded-2xl shadow-sm border border-slate-100 max-w-4xl">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="md:col-span-2">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nome Completo <span class="text-red-500">*</span></label>
                    <input type="text" id="cli-nome" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-blue-500 font-bold text-slate-800">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">CPF</label>
                    <input type="text" id="cli-doc" onkeyup="mascaraGeralCliente('cpf', this)" maxlength="14" placeholder="000.000.000-00" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-blue-500 font-medium text-slate-800">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Celular / WhatsApp <span class="text-red-500">*</span></label>
                    <input type="text" id="cli-tel" onkeyup="mascaraGeralCliente('tel', this)" maxlength="15" placeholder="(00) 00000-0000" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-blue-500 font-medium">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">E-mail</label>
                    <input type="email" id="cli-email" placeholder="cliente@email.com" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-blue-500 font-medium">
                </div>
            </div>

            <div class="mt-8 mb-5 border-b border-slate-100 pb-2">
                <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2"><i class="ph-bold ph-map-pin text-blue-500"></i> Endereço</h3>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="md:col-span-2">
                    <label class="flex items-center justify-between text-[10px] font-bold text-slate-500 uppercase mb-1">
                        <span>CEP (Busca Automática)</span>
                        <span id="cli-cep-status" class="hidden text-[9px]"></span>
                    </label>
                    <input type="text" id="cli-cep" onkeyup="mascaraGeralCliente('cep', this)" onblur="buscarCEPCliente(this.value)" maxlength="9" placeholder="00000-000" class="w-full md:w-1/2 border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-blue-500 font-bold text-slate-700">
                </div>
                <div class="md:col-span-2 flex gap-3">
                    <div class="flex-1">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Endereço (Rua/Av)</label>
                        <input type="text" id="cli-rua" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-100 outline-none">
                    </div>
                    <div class="w-24">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Número</label>
                        <input type="text" id="cli-num" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-50 focus:bg-white outline-none focus:border-blue-500 font-bold">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Bairro</label>
                    <input type="text" id="cli-bairro" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-100 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Cidade / UF</label>
                    <input type="text" id="cli-cidade" class="w-full border border-slate-300 p-3 rounded-xl text-sm bg-slate-100 outline-none">
                </div>
            </div>

            <div class="mt-8 flex justify-end gap-3 pt-5 border-t border-slate-100">
                <button onclick="alternarSubTelaClientes('lista')" class="px-6 py-3 text-slate-500 font-bold hover:bg-slate-100 rounded-xl transition text-sm">Cancelar</button>
                <button onclick="salvarClienteBD()" id="btn-salvar-cli" class="px-8 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-[0_4px_12px_rgba(37,99,235,0.3)] hover:bg-blue-700 transition transform active:scale-95 text-sm flex items-center gap-2">
                    <i class="ph-bold ph-floppy-disk text-lg"></i> Salvar Cliente
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Genérico para Confirmações (Otimizado, Sem Blur e Reutilizável) -->
<div id="modal-confirmacao-generica" class="hidden fixed inset-0 bg-slate-900/80 z-[2000] flex items-center justify-center p-4 fade-in">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden transform transition-all">
        <div class="p-6 text-center">
            <div id="icone-confirmacao" class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-100">
                <i class="ph-bold ph-warning text-3xl text-red-500"></i>
            </div>
            <h3 id="titulo-confirmacao" class="text-xl font-black text-slate-800 mb-2">Atenção!</h3>
            <p id="texto-confirmacao" class="text-sm text-slate-500 font-medium">Tem certeza que deseja continuar?</p>
        </div>
        <div class="p-4 bg-slate-50 border-t border-slate-100 flex gap-3">
            <button onclick="fecharModalConfirmacao()" class="flex-1 py-3 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-100 transition-colors shadow-sm">Cancelar</button>
            <button id="btn-confirmar-acao" onclick="executarAcaoConfirmada()" class="flex-1 py-3 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 transition-colors shadow-md flex items-center justify-center gap-2"><i class="ph-bold ph-check"></i> Confirmar</button>
        </div>
    </div>
</div>
